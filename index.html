<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyota FM | Investment Blueprint</title>
    <meta name="description" content="A business case, not a tech experiment. Digital transformation blueprint for Nyota FM." />
    <style>
      body {
        margin: 0;
        background-color: #0B1220;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0B1220;
        z-index: 9999;
      }
      .loader-pulse {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background-color: #F5A623;
        animation: pulse 1.5s ease-in-out infinite alternate;
        opacity: 0.8;
      }
      @keyframes pulse {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.2); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-pulse"></div>
        <div style="margin-top: 24px; color: #8A94A6; font-family: sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;">Loading Blueprint</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
