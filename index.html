    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Lite mode before first paint: stored choice, else data saver or 2G/3G.
      try {
        var stored = localStorage.getItem('nyota.lite')
        var c = navigator.connection
        var slow = c && (c.saveData || /(^|-)2g|3g/.test(c.effectiveType || ''))
        var lite = stored === '1' || (stored === null && slow)
        if (lite) document.documentElement.classList.add('lite')
        else ['dm-sans-latin-wght-normal', 'big-shoulders-display-latin-800-normal', 'instrument-serif-latin-400-normal'].forEach(function (f) {
          var l = document.createElement('link')
          l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; l.href = '/fonts/' + f + '.woff2'
          document.head.appendChild(l)
        })
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #090B0A; color: #F7F8F4; }
    </style>
  </head>
