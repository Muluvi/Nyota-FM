    <link rel="preload" as="image" type="image/webp" imagesrcset="/brand/nyota-star-256.webp 256w, /brand/nyota-star-512.webp 512w, /brand/nyota-star-1024.webp 1024w" imagesizes="(min-width: 1024px) 19rem, (min-width: 640px) 14rem, 10rem" fetchpriority="high" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nyota FM 107.3 · Twang'aa Transformation" />
    <meta property="og:description" content="The plan to make Nyota FM the cultural and commercial anchor of Western Kenya. Six decisions for the board." />

    <link rel="icon" type="image/png" sizes="48x48" href="/brand/icon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Lite mode before first paint: stored choice, else data saver or 2G/3G.
      try {
        var stored = localStorage.getItem('nyota.lite')
        var c = navigator.connection
        var slow = c && (c.saveData || /(^|-)2g|3g/.test(c.effectiveType || ''))
        var lite = stored === '1' || (stored === null && slow)
        var prefs = JSON.parse(localStorage.getItem('nyota.prefs') || '{}')
        var root = document.documentElement
        if (prefs.theme === 'light') root.classList.add('theme-light')
        if (prefs.accent === 'moss' || prefs.accent === 'brick') root.classList.add('accent-' + prefs.accent)
        if (prefs.motion === 'calm') root.classList.add('fx-calm')
        if (lite) document.documentElement.classList.add('lite')
        else ['dm-sans-latin-opsz-normal', 'dm-serif-display-latin-400-normal'].forEach(function (f) {
          var l = document.createElement('link')
          l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; l.href = '/fonts/' + f + '.woff2'
          document.head.appendChild(l)
        })
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #000000; color: #F8F2E2; }
    </style>
  </head>
  <body class="fx-noise">
    <div id="root"></div>
    <noscript>

      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
