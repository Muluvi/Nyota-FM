<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyota FM's Digital Leap: Investment Blueprint</title>
    <meta name="description" content="A Complete Social Media & BTL Investment Blueprint for Western Kenya's Community Heartbeat." />
    <style>
      body {
        margin: 0;
        background-color: #1B211E;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #1B211E;
        z-index: 9999;
      }
      .loader-pulse {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #B8925A;
        background-color: transparent;
        animation: pulse 1.5s ease-in-out infinite alternate;
        opacity: 0.9;
      }
      @keyframes pulse {
        0% { transform: scale(0.9); opacity: 0.4; }
        100% { transform: scale(1.1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-pulse"></div>
        <div style="margin-top: 20px; color: #8FA096; font-family: monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 2px;">Nyota FM • Broadcast Ledger</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
